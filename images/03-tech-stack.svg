<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 460" width="100%" height="100%">
<defs>
  <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#070c18" />
    <stop offset="100%" stop-color="#0a1429" />
  </linearGradient>
  <linearGradient id="neonBlue" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#93CCE9" />
    <stop offset="50%" stop-color="#1683DF" />
    <stop offset="100%" stop-color="#38bdf8" />
  </linearGradient>
  <pattern id="cardGrid" width="26" height="26" patternUnits="userSpaceOnUse">
    <path d="M 26 0 L 0 0 0 26" fill="none" stroke="#1683DF" stroke-width="0.5" opacity="0.08" />
  </pattern>
</defs>

<style>
  @keyframes br { 0%, 100% { opacity: 0.2; } 50% { opacity: 0.8; } }
  .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Courier New', monospace; }
  .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif; }
  .br { animation: br 3.5s ease-in-out infinite; }
</style>

<rect width="1600" height="460" fill="#050811" />

<!-- Outer Card Container -->
<rect x="20" y="16" width="1560" height="428" rx="14" fill="url(#cardBg)" stroke="#1683DF" stroke-width="2" opacity="0.9" />
<rect x="20" y="16" width="1560" height="428" rx="14" fill="url(#cardGrid)" />
<rect x="24" y="20" width="1552" height="420" rx="12" fill="none" stroke="#93CCE9" stroke-width="1" opacity="0.2" />

<!-- High-Tech Corner Brackets -->
<path d="M 20 54 V 16 H 58 M 1542 16 H 1580 V 54 M 20 406 V 444 H 58 M 1542 444 H 1580 V 406" fill="none" stroke="#1683DF" stroke-width="3.5" />

<!-- Header -->
<g transform="translate(60, 68)">
  <text x="0" y="0" class="mono" font-size="28" font-weight="700" fill="#1683DF">&lt;/&gt;</text>
  <text x="54" y="-1" class="sans" font-size="28" font-weight="800" fill="#F0F6FC">Tech Stack</text>
  <text x="210" y="-1" class="mono" font-size="16" fill="#8ea4c8">| Tools &amp; Technologies I Work With</text>
</g>

<!-- ==================== 4 CATEGORY PANELS ==================== -->

