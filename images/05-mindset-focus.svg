<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" width="100%" height="100%">
<defs>
  <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#070c18" />
    <stop offset="100%" stop-color="#0a1429" />
  </linearGradient>
  <linearGradient id="neonBlue" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#93CCE9" />
    <stop offset="50%" stop-color="#1683DF" />
    <stop offset="100%" stop-color="#38bdf8" />
  </linearGradient>
  <pattern id="cardGrid" width="28" height="28" patternUnits="userSpaceOnUse">
    <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1683DF" stroke-width="0.5" opacity="0.08" />
  </pattern>
</defs>

<style>
  @keyframes bl { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  @keyframes pu { 0%, 100% { opacity: 0.95; } 50% { opacity: 0.25; } }
  @keyframes sp { to { transform: rotate(360deg); } }
  .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Courier New', monospace; }
  .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif; }
  .bl { animation: bl 1.1s steps(1) infinite; }
  .pu { animation: pu 2.2s ease-in-out infinite; }
  .sp { transform-box: fill-box; transform-origin: center; animation: sp 18s linear infinite; }
</style>

<rect width="1600" height="520" fill="#050811" />

<!-- ==================== LEFT COLUMN: DEVELOPER MINDSET (width=1010) ==================== -->
<g transform="translate(20, 16)">
  <rect width="1010" height="488" rx="14" fill="url(#cardBg)" stroke="#1683DF" stroke-width="2" opacity="0.9" />
  <rect width="1010" height="488" rx="14" fill="url(#cardGrid)" />
  <rect x="4" y="4" width="1002" height="480" rx="12" fill="none" stroke="#93CCE9" stroke-width="1" opacity="0.2" />

  <!-- Corner Brackets -->
  <path d="M 0 40 V 0 H 40 M 970 0 H 1010 V 40 M 0 448 V 488 H 40 M 970 488 H 1010 V 448" fill="none" stroke="#1683DF" stroke-width="3" />

  <!-- Title -->
  <g transform="translate(42, 54)">
    <circle cx="14" cy="14" r="14" fill="#0d2142" stroke="#1683DF" stroke-width="1.5" />
    <text x="14" y="20" class="mono" font-size="16" font-weight="700" fill="#38bdf8" text-anchor="middle">i</text>
    <text x="42" y="20" class="sans" font-size="28" font-weight="800" fill="#F0F6FC">Developer Mindset</text>
    <text x="42" y="46" class="sans" font-size="14.5" fill="#8ea4c8">Not just writing code — thinking in scalable systems, product value, and continuous growth.</text>
  </g>

  <!-- 4 Mindset Cards (2x2 Grid) -->
  <g transform="translate(42, 134)">
    <!-- 1. Plan First -->
    <g transform="translate(0, 0)">
      <rect width="320" height="142" rx="10" fill="#09152b" stroke="#1683DF" stroke-width="1.5" />
      <rect x="0" y="0" width="36" height="3" fill="#1683DF" />
      <text x="20" y="36" class="sans" font-size="17" font-weight="700" fill="#F0F6FC">🎯 Plan Before Coding</text>
      <text x="20" y="66" class="sans" font-size="13" fill="#8ea4c8">Understand the requirements,</text>
      <text x="20" y="86" class="sans" font-size="13" fill="#8ea4c8">design the architecture,</text>
      <text x="20" y="106" class="sans" font-size="13" fill="#38bdf8">then write clean, robust code.</text>
    </g>

    <!-- 2. Build for Real Users -->
    <g transform="translate(340, 0)">
      <rect width="320" height="142" rx="10" fill="#09152b" stroke="#1683DF" stroke-width="1.5" />
      <rect x="0" y="0" width="36" height="3" fill="#1683DF" />
      <text x="20" y="36" class="sans" font-size="17" font-weight="700" fill="#F0F6FC">🏗️ Clean Architecture</text>
      <text x="20" y="66" class="sans" font-size="13" fill="#8ea4c8">Modular monoliths, separation</text>
      <text x="20" y="86" class="sans" font-size="13" fill="#8ea4c8">of concerns, and scalable</text>
      <text x="20" y="106" class="sans" font-size="13" fill="#38bdf8">APIs built for maintainability.</text>
    </g>

    <!-- 3. AI as Multiplier -->
    <g transform="translate(0, 160)">
      <rect width="320" height="142" rx="10" fill="#09152b" stroke="#1683DF" stroke-width="1.5" />
      <rect x="0" y="0" width="36" height="3" fill="#1683DF" />
      <text x="20" y="36" class="sans" font-size="17" font-weight="700" fill="#F0F6FC">🤖 AI as a Force Multiplier</text>
      <text x="20" y="66" class="sans" font-size="13" fill="#8ea4c8">Leveraging LLMs, automated</text>
      <text x="20" y="86" class="sans" font-size="13" fill="#8ea4c8">video pipelines &amp; AI agents</text>
      <text x="20" y="106" class="sans" font-size="13" fill="#38bdf8">to 10x developer output.</text>
    </g>

    <!-- 4. Continuous Learning -->
    <g transform="translate(340, 160)">
      <rect width="320" height="142" rx="10" fill="#09152b" stroke="#1683DF" stroke-width="1.5" />
      <rect x="0" y="0" width="36" height="3" fill="#1683DF" />
      <text x="20" y="36" class="sans" font-size="17" font-weight="700" fill="#F0F6FC">📈 Continuous Evolution</text>
      <text x="20" y="66" class="sans" font-size="13" fill="#8ea4c8">Mastering modern stacks,</text>
      <text x="20" y="86" class="sans" font-size="13" fill="#8ea4c8">cloud deployment &amp; system</text>
      <text x="20" y="106" class="sans" font-size="13" fill="#22C55E">design every single day.</text>
    </g>
  </g>

  <!-- CYBER AI EMBLEM (Right Side of Mindset Column) -->
  <g transform="translate(830, 240)">
    <!-- Rotating Cyber Rings -->
    <circle cx="0" cy="0" r="95" fill="none" stroke="#1683DF" stroke-width="1.5" stroke-dasharray="4 8" class="sp" />
    <circle cx="0" cy="0" r="115" fill="none" stroke="#93CCE9" stroke-width="1" stroke-dasharray="14 10" opacity="0.4" />
    <circle cx="0" cy="0" r="75" fill="#0b1b36" stroke="#1683DF" stroke-width="2" />

    <!-- Center AI Text -->
    <text x="0" y="18" class="mono" font-size="44" font-weight="800" fill="#38bdf8" text-anchor="middle" letter-spacing="2">AI</text>

    <!-- Node Points -->
    <circle cx="-65" cy="-35" r="4" fill="#93CCE9" class="pu" />
    <circle cx="65" cy="35" r="4" fill="#1683DF" class="pu" style="animation-delay: 0.6s;" />
    <circle cx="35" cy="-65" r="3.5" fill="#38bdf8" class="pu" style="animation-delay: 1.2s;" />
    <circle cx="-35" cy="65" r="3.5" fill="#22C55E" class="pu" style="animation-delay: 1.8s;" />
  </g>
</g>

<!-- ==================== RIGHT COLUMN: CURRENT FOCUS (width=530) ==================== -->
<g transform="translate(1050, 16)">
  <rect width="530" height="488" rx="14" fill="url(#cardBg)" stroke="#1683DF" stroke-width="2" opacity="0.9" />
  <rect width="530" height="488" rx="14" fill="url(#cardGrid)" />
  <rect x="4" y="4" width="522" height="480" rx="12" fill="none" stroke="#93CCE9" stroke-width="1" opacity="0.2" />

  <!-- Corner Brackets -->
  <path d="M 0 40 V 0 H 40 M 490 0 H 530 V 40 M 0 448 V 488 H 40 M 490 488 H 530 V 448" fill="none" stroke="#1683DF" stroke-width="3" />

  <!-- Header -->
  <g transform="translate(36, 54)">
    <!-- Terminal Icon -->
    <rect x="0" y="-18" width="34" height="34" rx="6" fill="#0d2142" stroke="#1683DF" stroke-width="1.5" />
    <text x="17" y="5" class="mono" font-size="16" font-weight="700" fill="#38bdf8" text-anchor="middle">&gt;_</text>
    <text x="46" y="8" class="sans" font-size="26" font-weight="800" fill="#F0F6FC">Current Focus</text>
    <text x="46" y="32" class="mono" font-size="13" fill="#8ea4c8">Building, shipping, learning...</text>
  </g>

  <!-- Focus Items List (Terminal Style) -->
  <g transform="translate(36, 126)">
    <!-- Box Container -->
    <rect width="458" height="264" rx="10" fill="#08142a" stroke="#1683DF" stroke-width="1.2" />

    <!-- Item 1: KyroPad & BoardEase -->
    <g transform="translate(20, 24)">
      <text x="0" y="18" class="sans" font-size="16" font-weight="600" fill="#F0F6FC">KyroPad &amp; BoardEase</text>
      <text x="0" y="36" class="mono" font-size="11.5" fill="#8ea4c8">React Native · Python · C#</text>
      <!-- Status Pill -->
      <g transform="translate(285, 4)">
        <rect width="130" height="30" rx="6" fill="#0c2347" stroke="#1683DF" stroke-width="1.2" />
        <circle cx="16" cy="15" r="3.5" fill="#22C55E" class="pu" />
        <text x="68" y="20" class="mono" font-size="12" font-weight="700" fill="#22C55E" text-anchor="middle">Building</text>
      </g>
    </g>
    <line x1="20" y1="84" x2="438" y2="84" stroke="#1683DF" stroke-width="1" stroke-dasharray="4 4" opacity="0.3" />

    <!-- Item 2: AI Video Pipelines -->
    <g transform="translate(20, 94)">
      <text x="0" y="18" class="sans" font-size="16" font-weight="600" fill="#F0F6FC">AI Video Ad Automation</text>
      <text x="0" y="36" class="mono" font-size="11.5" fill="#8ea4c8">GM Int'l Commerce LLC</text>
      <!-- Status Pill -->
      <g transform="translate(285, 4)">
        <rect width="130" height="30" rx="6" fill="#0c2347" stroke="#1683DF" stroke-width="1.2" />
        <circle cx="16" cy="15" r="3.5" fill="#38bdf8" class="pu" style="animation-delay: 0.5s;" />
        <text x="68" y="20" class="mono" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">Shipping</text>
      </g>
    </g>
    <line x1="20" y1="154" x2="438" y2="154" stroke="#1683DF" stroke-width="1" stroke-dasharray="4 4" opacity="0.3" />

    <!-- Item 3: AWS Cloud & System Design -->
    <g transform="translate(20, 164)">
      <text x="0" y="18" class="sans" font-size="16" font-weight="600" fill="#F0F6FC">AWS Cloud &amp; System Design</text>
      <text x="0" y="36" class="mono" font-size="11.5" fill="#8ea4c8">Practitioner Prep · Arch</text>
      <!-- Status Pill -->
      <g transform="translate(285, 4)">
        <rect width="130" height="30" rx="6" fill="#0c2347" stroke="#1683DF" stroke-width="1.2" />
        <circle cx="16" cy="15" r="3.5" fill="#F59E0B" class="pu" style="animation-delay: 1.0s;" />
        <text x="68" y="20" class="mono" font-size="12" font-weight="700" fill="#F59E0B" text-anchor="middle">Deepening</text>
      </g>
    </g>
    <line x1="20" y1="224" x2="438" y2="224" stroke="#1683DF" stroke-width="1" stroke-dasharray="4 4" opacity="0.3" />

    <!-- Item 4: BSIT Degree 2026 -->
    <g transform="translate(20, 234)">
      <text x="0" y="14" class="sans" font-size="15" font-weight="600" fill="#F0F6FC">BSIT Degree (2026)</text>
      <!-- Status Pill -->
      <g transform="translate(285, -2)">
        <rect width="130" height="28" rx="6" fill="#0c2347" stroke="#1683DF" stroke-width="1.2" />
        <circle cx="16" cy="14" r="3.5" fill="#a855f7" class="pu" style="animation-delay: 1.5s;" />
        <text x="68" y="18" class="mono" font-size="11.5" font-weight="700" fill="#a855f7" text-anchor="middle">Graduating</text>
      </g>
    </g>
  </g>

  <!-- Bottom Terminal Prompt -->
  <g transform="translate(36, 436)">
    <text x="0" y="0" class="mono" font-size="15" fill="#1683DF" font-weight="700">makinity@dev:~$</text>
    <text x="145" y="0" class="mono" font-size="15" fill="#F0F6FC"> keep going...</text>
    <rect x="270" y="-13" width="9" height="17" fill="#1683DF" class="bl" />
  </g>
</g>

</svg>
