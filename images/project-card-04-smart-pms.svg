        <g transform="translate(14, 14)"><circle cx="-1.5" cy="-3" r="0.8" fill="#3776AB"/><circle cx="1.5" cy="3" r="0.8" fill="#FFD43B"/><path d="M-4,-2.5 C-4,-4.5 0,-4.5 0,-2.5 V-0.8 H2.5 C4.5,-0.8 4.5,2.5 2.5,2.5 H1" fill="none" stroke="#3776AB" stroke-width="1.2"/><path d="M4,2.5 C4,4.5 0,4.5 0,2.5 V0.8 H-2.5 C-4.5,0.8 -4.5,-2.5 -2.5,-2.5 H-1" fill="none" stroke="#FFD43B" stroke-width="1.2"/></g>
        <text x="25" y="18" class="mono" font-size="11" font-weight="600" fill="#f0f6fc">Python</text>
