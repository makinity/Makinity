        <text x="25" y="18" class="mono" font-size="11" font-weight="600" fill="#f0f6fc">MySQL</text>
      </g>
    
      <g transform="translate(432, 150)">
        <rect width="135" height="28" rx="6" fill="#060b17" stroke="#22C55E" stroke-width="1.2" />
        <g transform="translate(14, 14)"><path d="M0,-6 L-4,0 H-2 L-5,4 H5 L2,4 H4 Z" fill="#22C55E"/></g>
        <text x="25" y="18" class="mono" font-size="11" font-weight="600" fill="#f0f6fc">Random Forest</text>
      </g>
    

  <!-- Divider -->
  <line x1="32" y1="216" x2="748" y2="216" stroke="#1683DF" stroke-width="1" opacity="0.3" />

  <!-- Highlights -->
  <text x="32" y="236" class="mono sub" font-size="11" font-weight="700">HIGHLIGHTS:</text>
  <text x="36" y="250" class="sans text" font-size="14" fill="#c9d1d9">• Random Forest ML model for performance prediction</text><text x="36" y="276" class="sans text" font-size="14" fill="#c9d1d9">• Data visualization &amp; analytics dashboard</text><text x="36" y="302" class="sans text" font-size="14" fill="#c9d1d9">• Laravel backend with clean architecture</text><text x="36" y="328" class="sans text" font-size="14" fill="#c9d1d9">• Role-based dashboards</text><text x="36" y="354" class="sans text" font-size="14" fill="#c9d1d9">• Employee evaluation system</text><text x="36" y="380" class="sans text" font-size="14" fill="#c9d1d9">• Department management</text>

