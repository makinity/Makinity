<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 540" width="100%" height="100%">

  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060b17" />
      <stop offset="50%" stop-color="#0a1428" />
      <stop offset="100%" stop-color="#060b17" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1683df" stroke-width="0.6" opacity="0.1" />
    </pattern>
  </defs>
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif; }
    .title { font-weight: 700; fill: #f0f6fc; }
    .sub { fill: #93CCE9; }
    .text { fill: #c9d1d9; font-size: 14px; }
  </style>

  <!-- Card Background -->
  <rect width="780" height="540" rx="14" fill="url(#cardBg)" stroke="#1683DF" stroke-width="2" opacity="0.95" />
  <rect width="780" height="540" rx="14" fill="url(#grid)" />

  <!-- Corner Brackets -->
  <path d="M 12 36 V 12 H 36 M 744 12 H 768 V 36 M 12 504 V 528 H 36 M 744 528 H 768 V 504" fill="none" stroke="#1683DF" stroke-width="3" />

  <!-- Top Accent Line -->
  <rect x="0" y="0" width="780" height="4" fill="#38bdf8" />

  <!-- Title -->
  <text x="32" y="44" class="sans title" font-size="24">🎬 Caption Remover</text>

  <!-- Tagline blockquote box -->
  <g transform="translate(32, 60)">
    <rect width="716" height="66" rx="6" fill="#091428" stroke="#1683DF" stroke-width="1" opacity="0.7" />
    <path d="M 0 0 V 66" stroke="#1683DF" stroke-width="3.5" />
    <text x="16" y="24" class="sans" font-size="13" font-style="italic" fill="#8b949e">
      A Python tool that removes burned-in subtitles and captions from videos using AI inpaintin...
    </text>
  </g>

  <!-- Stack Section with Branded Icons -->
  <text x="32" y="142" class="mono sub" font-size="11" font-weight="700">TECH STACK:</text>
  
      <g transform="translate(32, 150)">
        <rect width="90" height="28" rx="6" fill="#060b17" stroke="#3776AB" stroke-width="1.2" />
        <g transform="translate(14, 14)"><circle cx="-1.5" cy="-3" r="0.8" fill="#3776AB"/><circle cx="1.5" cy="3" r="0.8" fill="#FFD43B"/><path d="M-4,-2.5 C-4,-4.5 0,-4.5 0,-2.5 V-0.8 H2.5 C4.5,-0.8 4.5,2.5 2.5,2.5 H1" fill="none" stroke="#3776AB" stroke-width="1.2"/><path d="M4,2.5 C4,4.5 0,4.5 0,2.5 V0.8 H-2.5 C-4.5,0.8 -4.5,-2.5 -2.5,-2.5 H-1" fill="none" stroke="#FFD43B" stroke-width="1.2"/></g>
        <text x="25" y="18" class="mono" font-size="11" font-weight="600" fill="#f0f6fc">Python</text>
      </g>
    
      <g transform="translate(132, 150)">
        <rect width="85" height="28" rx="6" fill="#060b17" stroke="#EE4C2C" stroke-width="1.2" />
        <g transform="translate(14, 14)"><path d="M0,-7 C1.5,-4 4,-3 3,0 C2,3 -2,3 -3,0 C-4,-3 -1.5,-4 0,-7 Z" fill="#EE4C2C"/><circle cx="2" cy="-4" r="1" fill="#EE4C2C"/></g>
        <text x="25" y="18" class="mono" font-size="11" font-weight="600" fill="#f0f6fc">torch</text>
      </g>
    
      <g transform="translate(227, 150)">
        <rect width="90" height="28" rx="6" fill="#060b17" stroke="#22B14C" stroke-width="1.2" />
        <g transform="translate(14, 14)"><circle cx="-3" cy="-2.5" r="2.2" fill="none" stroke="#ED1C24" stroke-width="1.2"/><circle cx="3" cy="-2.5" r="2.2" fill="none" stroke="#22B14C" stroke-width="1.2"/><circle cx="0" cy="3" r="2.2" fill="none" stroke="#00A2E8" stroke-width="1.2"/></g>
        <text x="25" y="18" class="mono" font-size="11" font-weight="600" fill="#f0f6fc">opencv</text>
      </g>
    
      <g transform="translate(327, 150)">
        <rect width="95" height="28" rx="6" fill="#060b17" stroke="#38bdf8" stroke-width="1.2" />
        <g transform="translate(14, 14)"><circle cx="0" cy="0" r="5" fill="none" stroke="#38bdf8" stroke-width="1.2"/><path d="M-3,0 H3 M0,-3 V3" stroke="#93CCE9" stroke-width="1"/></g>
        <text x="25" y="18" class="mono" font-size="11" font-weight="600" fill="#f0f6fc">LaMa AI</text>
      </g>
    
      <g transform="translate(432, 150)">
        <rect width="95" height="28" rx="6" fill="#060b17" stroke="#007808" stroke-width="1.2" />
        <g transform="translate(14, 14)"><path d="M-5,-5 L5,5 M-5,5 L5,-5" stroke="#007808" stroke-width="1.8"/><rect x="-3" y="-3" width="6" height="6" fill="#007808"/></g>
        <text x="25" y="18" class="mono" font-size="11" font-weight="600" fill="#f0f6fc">FFmpeg</text>
      </g>
    
      <g transform="translate(537, 150)">
        <rect width="90" height="28" rx="6" fill="#060b17" stroke="#2496ED" stroke-width="1.2" />
        <g transform="translate(14, 14)"><path d="M-6,1 H3.5 C5,1 6,0 6,-1 C5,-1 4,-2 3.5,-2 H-2 V-0.8 H-6 Z" fill="#2496ED"/><rect x="-4.5" y="-3.5" width="1.5" height="1.5" fill="#2496ED"/><rect x="-2.5" y="-3.5" width="1.5" height="1.5" fill="#2496ED"/><rect x="-0.5" y="-3.5" width="1.5" height="1.5" fill="#2496ED"/></g>
        <text x="25" y="18" class="mono" font-size="11" font-weight="600" fill="#f0f6fc">Docker</text>
      </g>
    

  <!-- Divider -->
  <line x1="32" y1="216" x2="748" y2="216" stroke="#1683DF" stroke-width="1" opacity="0.3" />

  <!-- Highlights -->
  <text x="32" y="236" class="mono sub" font-size="11" font-weight="700">HIGHLIGHTS:</text>
  <text x="36" y="250" class="sans text" font-size="14" fill="#c9d1d9">• AI inpainting with LaMa — reconstructs background under captions</text><text x="36" y="276" class="sans text" font-size="14" fill="#c9d1d9">• Interactive ROI selector — drag to pick subtitle region visually</text><text x="36" y="302" class="sans text" font-size="14" fill="#c9d1d9">• Dual color mode — handles white &amp; black burned-in text</text><text x="36" y="328" class="sans text" font-size="14" fill="#c9d1d9">• Original audio preserved automatically via FFmpeg</text><text x="36" y="354" class="sans text" font-size="14" fill="#c9d1d9">• GPU auto-detect — CUDA → Apple Silicon MPS → CPU fallback</text><text x="36" y="380" class="sans text" font-size="14" fill="#c9d1d9">• Web UI via Gradio + Docker-ready for deployment</text>

  <!-- Bottom Action Button Banner -->
  <g transform="translate(32, 474)">
    <rect width="716" height="42" rx="8" fill="#060b17" stroke="#38bdf8" stroke-width="1.5" />
    <text x="358" y="26" class="mono" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1">
      📂 VIEW REPO →
    </text>
  </g>
</svg>
