<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 640" width="100%" height="100%">

  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060b17" />
      <stop offset="50%" stop-color="#0a1428" />
      <stop offset="100%" stop-color="#060b17" />
    </linearGradient>
    <linearGradient id="neonBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#93CCE9" />
      <stop offset="50%" stop-color="#1683DF" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#1683df" stroke-width="0.7" opacity="0.1" />
    </pattern>
  </defs>
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif; }
    .title { font-weight: 700; fill: #f0f6fc; }
    .sub { fill: #93CCE9; }
    .text { fill: #c9d1d9; }
  </style>

  <!-- Card Background -->
  <rect width="780" height="640" rx="16" fill="url(#cardBg)" stroke="#1683DF" stroke-width="2.2" opacity="0.95" />
  <rect width="780" height="640" rx="16" fill="url(#grid)" />

  <!-- Corner Brackets -->
  <path d="M 12 40 V 12 H 40 M 740 12 H 768 V 40 M 12 600 V 628 H 40 M 740 628 H 768 V 600" fill="none" stroke="#1683DF" stroke-width="3.5" />

  <!-- Top Accent Line -->
  <rect x="0" y="0" width="780" height="5" fill="#1683DF" />

  <!-- Title -->
  <text x="32" y="48" class="sans title" font-size="28">🍗 Chicken Express</text>

  <!-- Tagline blockquote box -->
  <g transform="translate(32, 66)">
    <rect width="716" height="66" rx="8" fill="#091428" stroke="#1683DF" stroke-width="1.2" opacity="0.75" />
    <path d="M 0 0 V 66" stroke="#1683DF" stroke-width="4" />
    <text x="18" y="38" class="sans" font-size="16" font-style="italic" fill="#8b949e">
      Web-based chicken ordering system with PayMongo integration &amp; full admin dashboard.
    </text>
  </g>

  <!-- Stack Section with Branded Icons -->
  <text x="32" y="146" class="mono sub" font-size="13" font-weight="700">TECH STACK:</text>
  
      <g transform="translate(32, 155)">
        <rect width="95" height="36" rx="8" fill="#060b17" stroke="#ED8B00" stroke-width="1.4" />
        <g transform="translate(18, 18)"></g>
        <text x="34" y="23" class="mono" font-size="13" font-weight="700" fill="#f0f6fc">Java</text>
      </g>
    
      <g transform="translate(139, 155)">
        <rect width="140" height="36" rx="8" fill="#060b17" stroke="#6DB33F" stroke-width="1.4" />
        <g transform="translate(18, 18)"></g>
        <text x="34" y="23" class="mono" font-size="13" font-weight="700" fill="#f0f6fc">Spring Boot</text>
      </g>
    
      <g transform="translate(291, 155)">
        <rect width="130" height="36" rx="8" fill="#060b17" stroke="#22C55E" stroke-width="1.4" />
        <g transform="translate(18, 18)"></g>
        <text x="34" y="23" class="mono" font-size="13" font-weight="700" fill="#f0f6fc">Thymeleaf</text>
      </g>
    
      <g transform="translate(433, 155)">
        <rect width="110" height="36" rx="8" fill="#060b17" stroke="#4479A1" stroke-width="1.4" />
        <g transform="translate(18, 18)"><ellipse cx="0" cy="-4" rx="8" ry="2.8" fill="none" stroke="#4479A1" stroke-width="1.5"/><path d="M-8,-4 V4 C-8,6.8 8,6.8 8,4 V-4 M-8,0 C-8,2.5 8,2.5 8,0" fill="none" stroke="#4479A1" stroke-width="1.5"/></g>
        <text x="34" y="23" class="mono" font-size="13" font-weight="700" fill="#f0f6fc">MySQL</text>
      </g>
    
      <g transform="translate(555, 155)">
        <rect width="130" height="36" rx="8" fill="#060b17" stroke="#0066FF" stroke-width="1.4" />
        <g transform="translate(18, 18)"><rect x="-9.5" y="-9.5" width="19" height="19" rx="3.5" fill="#0066FF"/><text x="0" y="5" font-family="sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">P</text></g>
        <text x="34" y="23" class="mono" font-size="13" font-weight="700" fill="#f0f6fc">PayMongo</text>
      </g>
    

  <!-- Divider -->
  <line x1="32" y1="246" x2="748" y2="246" stroke="#1683DF" stroke-width="1.2" opacity="0.3" />

  <!-- Highlights -->
  <text x="32" y="266" class="mono sub" font-size="13" font-weight="700">HIGHLIGHTS:</text>
  <text x="36" y="280" class="sans text" font-size="17" font-weight="500" fill="#c9d1d9">• Customer storefront — browse, cart, checkout &amp; order tracking</text><text x="36" y="312" class="sans text" font-size="17" font-weight="500" fill="#c9d1d9">• Spring Security with role-based access (Customer / Admin)</text><text x="36" y="344" class="sans text" font-size="17" font-weight="500" fill="#c9d1d9">• PayMongo hosted checkout (GCash, Maya, card)</text><text x="36" y="376" class="sans text" font-size="17" font-weight="500" fill="#c9d1d9">• Webhook-driven order status updates</text><text x="36" y="408" class="sans text" font-size="17" font-weight="500" fill="#c9d1d9">• Admin dashboard with Excel &amp; PDF reports</text><text x="36" y="440" class="sans text" font-size="17" font-weight="500" fill="#c9d1d9">• Full product &amp; order management system</text>

  <!-- Bottom Action Button Banner -->
  <g transform="translate(32, 566)">
    <rect width="716" height="52" rx="10" fill="#060b17" stroke="#1683DF" stroke-width="1.8" />
    <text x="358" y="33" class="mono" font-size="16" font-weight="800" fill="#1683DF" text-anchor="middle" letter-spacing="1">
      📂 VIEW REPO →
    </text>
  </g>
</svg>
