<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 480" width="100%" height="100%">

  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060b17" />
      <stop offset="50%" stop-color="#0a1428" />
      <stop offset="100%" stop-color="#060b17" />
    </linearGradient>
    <linearGradient id="neonBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#93CCE9" />
      <stop offset="50%" stop-color="#1683DF" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#1683df" stroke-width="0.7" opacity="0.1" />
    </pattern>
  </defs>
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif; }
    .title { font-weight: 700; fill: #f0f6fc; }
    .sub { fill: #93CCE9; }
    .text { fill: #c9d1d9; }
  </style>

  <!-- Card Background -->
  <rect width="1600" height="480" rx="16" fill="url(#cardBg)" stroke="#1683DF" stroke-width="2.2" opacity="0.95" />
  <rect width="1600" height="480" rx="16" fill="url(#grid)" />

  <!-- Corner Brackets -->
  <path d="M 14 50 V 14 H 50 M 1550 14 H 1586 V 50 M 14 430 V 466 H 50 M 1550 466 H 1586 V 430" fill="none" stroke="#1683DF" stroke-width="4" />

  <!-- Top Quote Banner -->
  <g transform="translate(36, 28)">
    <rect width="1528" height="74" rx="10" fill="#091428" stroke="#1683DF" stroke-width="1.5" opacity="0.9" />
    <path d="M 0 0 V 74" stroke="#1683DF" stroke-width="5" />
    <text x="28" y="44" class="mono" font-size="22" fill="#f0f6fc" font-style="italic">
      "Software development begins with planning, not coding. Every great system starts with understanding the problem."
    </text>
  </g>

  <!-- 3 Pillar Panels -->
  <!-- Pillar 1: Plan First -->
  <g transform="translate(36, 126)">
    <rect width="490" height="316" rx="14" fill="#091428" stroke="#1683DF" stroke-width="1.8" />
    <rect width="490" height="8" fill="#1683DF" />
    
    <text x="32" y="55" class="sans title" font-size="28">🎯 Plan First</text>
    <text x="32" y="92" class="mono sub" font-size="16" font-weight="700">Understand → Research → Design</text>
    <line x1="32" y1="112" x2="458" y2="112" stroke="#1683DF" stroke-width="1.2" opacity="0.3" />
    
    <text x="32" y="156" class="sans text" font-size="21" fill="#c9d1d9">Deep dive into requirements before</text>
    <text x="32" y="190" class="sans text" font-size="21" fill="#c9d1d9">writing a single line of code.</text>
    <text x="32" y="235" class="sans text" font-size="21" fill="#c9d1d9">Map data models &amp; API contracts.</text>
    
    <g transform="translate(32, 260)">
      <rect width="426" height="34" rx="6" fill="#060b17" stroke="#1683DF" stroke-width="1" />
      <text x="14" y="23" class="mono" font-size="14" font-weight="700" fill="#93CCE9">→ Schema design &amp; system architecture</text>
    </g>
  </g>

  <!-- Pillar 2: Build Right -->
  <g transform="translate(555, 126)">
    <rect width="490" height="316" rx="14" fill="#091428" stroke="#1683DF" stroke-width="1.8" />
    <rect width="490" height="8" fill="#38bdf8" />
    
    <text x="32" y="55" class="sans title" font-size="28">🏗️ Build Right</text>
    <text x="32" y="92" class="mono sub" font-size="16" font-weight="700">Clean architecture &amp; maintainability</text>
    <line x1="32" y1="112" x2="458" y2="112" stroke="#1683DF" stroke-width="1.2" opacity="0.3" />
    
    <text x="32" y="156" class="sans text" font-size="21" fill="#c9d1d9">Follow SOLID principles and separation</text>
    <text x="32" y="190" class="sans text" font-size="21" fill="#c9d1d9">of concerns across all layers.</text>
    <text x="32" y="235" class="sans text" font-size="21" fill="#c9d1d9">Write self-documenting codebases.</text>
    
    <g transform="translate(32, 260)">
      <rect width="426" height="34" rx="6" fill="#060b17" stroke="#38bdf8" stroke-width="1" />
      <text x="14" y="23" class="mono" font-size="14" font-weight="700" fill="#38bdf8">→ Modular components &amp; robust typing</text>
    </g>
  </g>

  <!-- Pillar 3: Scale Fast -->
  <g transform="translate(1074, 126)">
    <rect width="490" height="316" rx="14" fill="#091428" stroke="#1683DF" stroke-width="1.8" />
    <rect width="490" height="8" fill="#22C55E" />
    
    <text x="32" y="55" class="sans title" font-size="28">📈 Scale Fast</text>
    <text x="32" y="92" class="mono sub" font-size="16" font-weight="700">Code for today, architect for tomorrow</text>
    <line x1="32" y1="112" x2="458" y2="112" stroke="#1683DF" stroke-width="1.2" opacity="0.3" />
    
    <text x="32" y="156" class="sans text" font-size="21" fill="#c9d1d9">Automate testing, CI/CD pipelines,</text>
    <text x="32" y="190" class="sans text" font-size="21" fill="#c9d1d9">and cloud deployments.</text>
    <text x="32" y="235" class="sans text" font-size="21" fill="#c9d1d9">Optimize database &amp; async queue jobs.</text>
    
    <g transform="translate(32, 260)">
      <rect width="426" height="34" rx="6" fill="#060b17" stroke="#22C55E" stroke-width="1" />
      <text x="14" y="23" class="mono" font-size="14" font-weight="700" fill="#22C55E">→ Resilient cloud infrastructure</text>
    </g>
  </g>
</svg>
