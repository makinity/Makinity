<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 640" width="100%" height="100%">

  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060b17" />
      <stop offset="50%" stop-color="#0a1428" />
      <stop offset="100%" stop-color="#060b17" />
    </linearGradient>
    <linearGradient id="neonBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#93CCE9" />
      <stop offset="50%" stop-color="#1683DF" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#1683df" stroke-width="0.7" opacity="0.1" />
    </pattern>
  </defs>
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif; }
    .title { font-weight: 700; fill: #f0f6fc; }
    .sub { fill: #93CCE9; }
    .text { fill: #c9d1d9; }
  </style>

  <!-- Card Background -->
  <rect width="780" height="640" rx="16" fill="url(#cardBg)" stroke="#1683DF" stroke-width="2.2" opacity="0.95" />
  <rect width="780" height="640" rx="16" fill="url(#grid)" />

  <!-- Corner Brackets -->
  <path d="M 12 40 V 12 H 40 M 740 12 H 768 V 40 M 12 600 V 628 H 40 M 740 628 H 768 V 600" fill="none" stroke="#1683DF" stroke-width="3.5" />

  <!-- Top Accent Line -->
  <rect x="0" y="0" width="780" height="5" fill="#22C55E" />

  <!-- Title -->
  <text x="32" y="48" class="sans title" font-size="28">🌐 MakiSync</text>

  <!-- Tagline blockquote box -->
  <g transform="translate(32, 66)">
    <rect width="716" height="66" rx="8" fill="#091428" stroke="#1683DF" stroke-width="1.2" opacity="0.75" />
    <path d="M 0 0 V 66" stroke="#1683DF" stroke-width="4" />
    <text x="18" y="38" class="sans" font-size="16" font-style="italic" fill="#8b949e">
      Personal brand portfolio website showcasing services, projects, and capabilities.
    </text>
  </g>

  <!-- Stack Section with Branded Icons -->
  <text x="32" y="146" class="mono sub" font-size="13" font-weight="700">TECH STACK:</text>
  
      <g transform="translate(32, 155)">
        <rect width="115" height="36" rx="8" fill="#060b17" stroke="#f0f6fc" stroke-width="1.4" />
        <g transform="translate(18, 18)"><circle cx="0" cy="0" r="11" fill="#000000" stroke="#f0f6fc" stroke-width="1.2"/><path d="M-5,6 L-5,-6 L-2.5,-6 L4,4 L4,-6 L6,-6 L6,6 L3.5,6 L-3,-3.5 L-3,6 Z" fill="#ffffff"/></g>
        <text x="34" y="23" class="mono" font-size="13" font-weight="700" fill="#f0f6fc">Next.js</text>
      </g>
    
      <g transform="translate(159, 155)">
        <rect width="130" height="36" rx="8" fill="#060b17" stroke="#3178C6" stroke-width="1.4" />
        <g transform="translate(18, 18)"><rect x="-10" y="-10" width="20" height="20" rx="2.5" fill="#3178C6"/><text x="0" y="5.5" font-family="sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">TS</text></g>
        <text x="34" y="23" class="mono" font-size="13" font-weight="700" fill="#f0f6fc">TypeScript</text>
      </g>
    
      <g transform="translate(301, 155)">
        <rect width="110" height="36" rx="8" fill="#060b17" stroke="#f0f6fc" stroke-width="1.4" />
        <g transform="translate(18, 18)"><polygon points="0,-9 9,6 -9,6" fill="#f0f6fc"/></g>
        <text x="34" y="23" class="mono" font-size="13" font-weight="700" fill="#f0f6fc">Vercel</text>
      </g>
    
      <g transform="translate(423, 155)">
        <rect width="120" height="36" rx="8" fill="#060b17" stroke="#06B6D4" stroke-width="1.4" />
        <g transform="translate(18, 18)"><path d="M-10,2 C-8,-4 -4,-4 -1,0 C2,4 6,4 8,1 C7,5 2,5 -1,1 C-4,-3 -7,-3 -10,2 Z M-6,-4 C-4,-9 0,-9 3,-5 C6,-1 10,-1 12,-4 C11,0 7,0 4,-3 C1,-7 -2,-7 -6,-4 Z" fill="#06B6D4"/></g>
        <text x="34" y="23" class="mono" font-size="13" font-weight="700" fill="#f0f6fc">Tailwind</text>
      </g>
    

  <!-- Divider -->
  <line x1="32" y1="246" x2="748" y2="246" stroke="#1683DF" stroke-width="1.2" opacity="0.3" />

  <!-- Highlights -->
  <text x="32" y="266" class="mono sub" font-size="13" font-weight="700">HIGHLIGHTS:</text>
  <text x="36" y="280" class="sans text" font-size="17" font-weight="500" fill="#c9d1d9">• Consistent MakiSync branding (#1683DF, #93CCE9)</text><text x="36" y="312" class="sans text" font-size="17" font-weight="500" fill="#c9d1d9">• Fully responsive design</text><text x="36" y="344" class="sans text" font-size="17" font-weight="500" fill="#c9d1d9">• Deployed on Vercel</text><text x="36" y="376" class="sans text" font-size="17" font-weight="500" fill="#c9d1d9">• Service showcase (SMM, VA, Web Dev)</text><text x="36" y="408" class="sans text" font-size="17" font-weight="500" fill="#c9d1d9">• 📄 Project portfolio integration</text><text x="36" y="440" class="sans text" font-size="17" font-weight="500" fill="#c9d1d9">• SEO-optimized</text>

  <!-- Bottom Action Button Banner -->
  <g transform="translate(32, 566)">
    <rect width="716" height="52" rx="10" fill="#060b17" stroke="#22C55E" stroke-width="1.8" />
    <text x="358" y="33" class="mono" font-size="16" font-weight="800" fill="#22C55E" text-anchor="middle" letter-spacing="1">
      🌐 LIVE SITE · 📂 SOURCE →
    </text>
  </g>
</svg>
