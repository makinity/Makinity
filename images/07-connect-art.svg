<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 150" width="100%" height="100%">
<defs>
  <linearGradient id="artBg" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#050811" />
    <stop offset="100%" stop-color="#0a152e" />
  </linearGradient>
  <linearGradient id="mountainFill" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#0f2952" />
    <stop offset="100%" stop-color="#060b17" />
  </linearGradient>
</defs>

<style>
  @keyframes pu { 0%, 100% { opacity: 0.95; } 50% { opacity: 0.25; } }
  .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Courier New', monospace; }
  .pu { animation: pu 2.2s ease-in-out infinite; }
</style>

<rect width="280" height="150" fill="url(#artBg)" />

<!-- Outer subtle border -->
<rect x="2" y="2" width="276" height="146" rx="10" fill="none" stroke="#1683DF" stroke-width="1.2" opacity="0.4" />

<!-- Mountain Silhouettes -->
<path d="M 0 150 L 0 95 L 34 72 L 56 86 L 96 32 L 132 76 L 154 58 L 200 102 L 236 64 L 280 106 L 280 150 Z" fill="url(#mountainFill)" stroke="#1683DF" stroke-width="2" />

<!-- Glowing Peak Lines -->
<polyline points="0,95 34,72 56,86 96,32 132,76 154,58 200,102 236,64 280,106" fill="none" stroke="#38bdf8" stroke-width="1.5" />
<polygon points="96,32 108,50 96,60 84,50" fill="#93CCE9" opacity="0.6" />

<!-- Starfield / Pulsing nodes -->
<circle cx="28" cy="30" r="1.3" fill="#93CCE9" class="pu" style="animation-delay: 0.2s;" />
<circle cx="68" cy="18" r="1.5" fill="#ffffff" class="pu" style="animation-delay: 1.1s;" />
<circle cx="120" cy="24" r="1.2" fill="#38bdf8" class="pu" style="animation-delay: 0.6s;" />
<circle cx="168" cy="16" r="1.6" fill="#ffffff" class="pu" style="animation-delay: 1.7s;" />
<circle cx="215" cy="28" r="1.3" fill="#93CCE9" class="pu" style="animation-delay: 0.4s;" />
<circle cx="254" cy="20" r="1.5" fill="#38bdf8" class="pu" style="animation-delay: 2.1s;" />
<circle cx="145" cy="40" r="1.2" fill="#ffffff" class="pu" style="animation-delay: 1.4s;" />
<circle cx="185" cy="45" r="1.4" fill="#93CCE9" class="pu" style="animation-delay: 0.9s;" />

<!-- Motto Text at Bottom -->
<rect x="25" y="112" width="230" height="26" rx="13" fill="#060e1f" stroke="#1683DF" stroke-width="1" opacity="0.9" />
<text x="140" y="129" class="mono" font-size="12" font-weight="700" fill="#F0F6FC" text-anchor="middle" letter-spacing="1.5">PLAN · BUILD · SCALE</text>

</svg>
