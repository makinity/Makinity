<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" width="100%" height="100%">

  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060b17" />
      <stop offset="50%" stop-color="#0a1428" />
      <stop offset="100%" stop-color="#060b17" />
    </linearGradient>
    <linearGradient id="neonBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#93CCE9" />
      <stop offset="50%" stop-color="#1683DF" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#1683df" stroke-width="0.7" opacity="0.1" />
    </pattern>
  </defs>
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif; }
    .title { font-weight: 700; fill: #f0f6fc; }
    .sub { fill: #93CCE9; }
    .text { fill: #c9d1d9; }
  </style>

  <!-- Card Background -->
  <rect width="1600" height="420" rx="16" fill="url(#cardBg)" stroke="#1683DF" stroke-width="2.2" opacity="0.95" />
  <rect width="1600" height="420" rx="16" fill="url(#grid)" />

  <!-- Corner Brackets -->
  <path d="M 14 50 V 14 H 50 M 1550 14 H 1586 V 50 M 14 370 V 406 H 50 M 1550 406 H 1586 V 370" fill="none" stroke="#1683DF" stroke-width="4" />

  <!-- 3 Cert Cards -->
  <!-- Cert 1: COIL 2025 -->
  <g transform="translate(36, 32)">
    <rect width="490" height="280" rx="14" fill="#091428" stroke="#1683DF" stroke-width="1.8" />
    <rect width="490" height="7" fill="#1683DF" />
    <text x="245" y="55" class="sans title" font-size="26" text-anchor="middle">🎓 COIL 2025</text>
    <text x="245" y="98" class="sans" font-size="20" font-weight="600" fill="#f0f6fc" text-anchor="middle">Tourism Web Application</text>
    <text x="245" y="132" class="mono sub" font-size="16" text-anchor="middle">DDSC × EVSU · Philippines</text>
    
    <g transform="translate(125, 180)">
      <rect width="240" height="50" rx="8" fill="#060b17" stroke="#1683DF" stroke-width="2" />
      <text x="120" y="32" class="mono" font-size="17" font-weight="700" fill="#1683DF" text-anchor="middle">COIL Program · 2025</text>
    </g>
  </g>

  <!-- Cert 2: COIL 2026 -->
  <g transform="translate(555, 32)">
    <rect width="490" height="280" rx="14" fill="#091428" stroke="#1683DF" stroke-width="1.8" />
    <rect width="490" height="7" fill="#38bdf8" />
    <text x="245" y="55" class="sans title" font-size="26" text-anchor="middle">🎓 COIL 2026</text>
    <text x="245" y="98" class="sans" font-size="20" font-weight="600" fill="#f0f6fc" text-anchor="middle">SociaLite Social Media App</text>
    <text x="245" y="132" class="mono sub" font-size="16" text-anchor="middle">DDSC × NMU · Cambodia</text>
    
    <g transform="translate(125, 180)">
      <rect width="240" height="50" rx="8" fill="#060b17" stroke="#38bdf8" stroke-width="2" />
      <text x="120" y="32" class="mono" font-size="17" font-weight="700" fill="#38bdf8" text-anchor="middle">COIL Program · 2026</text>
    </g>
  </g>

  <!-- Cert 3: VA Bar -->
  <g transform="translate(1074, 32)">
    <rect width="490" height="280" rx="14" fill="#091428" stroke="#1683DF" stroke-width="1.8" />
    <rect width="490" height="7" fill="#22C55E" />
    <text x="245" y="55" class="sans title" font-size="26" text-anchor="middle">📜 The VA Bar</text>
    <text x="245" y="98" class="sans" font-size="20" font-weight="600" fill="#f0f6fc" text-anchor="middle">SMM · Lead Gen · Graphic Design</text>
    <text x="245" y="132" class="mono sub" font-size="16" text-anchor="middle">Email Marketing · Administrative</text>
    
    <g transform="translate(125, 180)">
      <rect width="240" height="50" rx="8" fill="#060b17" stroke="#22C55E" stroke-width="2" />
      <text x="120" y="32" class="mono" font-size="17" font-weight="700" fill="#22C55E" text-anchor="middle">The VA Bar · Aug 2026</text>
    </g>
  </g>

  <!-- Bottom Goals Pill -->
  <g transform="translate(36, 335)">
    <rect width="1528" height="56" rx="10" fill="#091428" stroke="#1683DF" stroke-width="1.3" opacity="0.8" />
    <text x="764" y="35" class="mono" font-size="18" font-weight="700" fill="#93CCE9" text-anchor="middle">
      🎯 Working toward: Google Digital Marketing · AWS Cloud Practitioner · GitHub Foundations
    </text>
  </g>
</svg>
