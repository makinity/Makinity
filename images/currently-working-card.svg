      <text x="28" y="86" class="sans text" font-size="19" font-weight="600" fill="#f0f6fc">Learning ML &amp; AI patterns</text>
      <text x="28" y="122" class="mono sub" font-size="15" font-weight="700">Gemini API, Groq, automation</text>
