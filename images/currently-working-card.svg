  <!-- Row 2 -->
  
    <g transform="translate(36, 235)">
      <rect width="490" height="165" rx="14" fill="#091428" stroke="#1683DF" stroke-width="1.5" />
      <text x="28" y="46" class="sans title" font-size="24">☁️ Cloud &amp; DevOps</text>
