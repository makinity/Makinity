      <text x="28" y="122" class="mono sub" font-size="15" font-weight="700">Desktop + Mobile + API</text>
    </g>
  
  
    <g transform="translate(1074, 36)">
      <rect width="490" height="165" rx="14" fill="#091428" stroke="#1683DF" stroke-width="1.5" />
