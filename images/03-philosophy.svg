<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 360" width="100%" height="100%">

  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060b17" />
      <stop offset="50%" stop-color="#0a1428" />
      <stop offset="100%" stop-color="#060b17" />
    </linearGradient>
    <linearGradient id="neonBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#93CCE9" />
      <stop offset="50%" stop-color="#1683DF" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f0f6fc" />
      <stop offset="100%" stop-color="#93CCE9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1683df" stroke-width="0.6" opacity="0.1" />
    </pattern>
  </defs>
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif; }
    .title { font-weight: 700; fill: #f0f6fc; }
    .sub { fill: #93CCE9; }
    .text { fill: #c9d1d9; font-size: 15px; }
  </style>

  <!-- Card Background -->
  <rect width="1600" height="360" rx="14" fill="url(#cardBg)" stroke="#1683DF" stroke-width="2" opacity="0.95" />
  <rect width="1600" height="360" rx="14" fill="url(#grid)" />

  <!-- Corner Brackets -->
  <path d="M 12 40 V 12 H 40 M 1560 12 H 1588 V 40 M 12 320 V 348 H 40 M 1560 348 H 1588 V 320" fill="none" stroke="#1683DF" stroke-width="3.5" />

  <!-- Top Quote Banner -->
  <g transform="translate(36, 26)">
    <rect width="1528" height="58" rx="8" fill="#091428" stroke="#1683DF" stroke-width="1.2" opacity="0.9" />
    <path d="M 0 0 V 58" stroke="#1683DF" stroke-width="4" />
    <text x="24" y="35" class="mono" font-size="16" fill="#f0f6fc" font-style="italic">
      "Software development begins with planning, not coding. Every great system starts with understanding the problem, designing the architecture, and building for maintainability."
    </text>
  </g>

  <!-- 3 Pillar Panels -->
  <!-- Pillar 1: Plan First -->
  <g transform="translate(36, 104)">
    <rect width="490" height="224" rx="12" fill="#091428" stroke="#1683DF" stroke-width="1.5" />
    <rect width="490" height="6" fill="#1683DF" />
    
    <text x="30" y="44" class="sans title" font-size="22">🎯 Plan First</text>
    <text x="30" y="74" class="mono sub" font-size="13" font-weight="600">Understand → Research → Design → Build</text>
    <line x1="30" y1="92" x2="460" y2="92" stroke="#1683DF" stroke-width="1" opacity="0.25" />
    
    <text x="30" y="126" class="sans text" font-size="15" fill="#c9d1d9">Deep dive into requirements before writing code.</text>
    <text x="30" y="152" class="sans text" font-size="15" fill="#c9d1d9">Map data models, API contracts, and user flows.</text>
    <text x="30" y="188" class="mono" font-size="13" fill="#93CCE9">→ Architecture diagrams &amp; schema design</text>
  </g>

  <!-- Pillar 2: Build Right -->
  <g transform="translate(555, 104)">
    <rect width="490" height="224" rx="12" fill="#091428" stroke="#1683DF" stroke-width="1.5" />
    <rect width="490" height="6" fill="#38bdf8" />
    
    <text x="30" y="44" class="sans title" font-size="22">🏗️ Build Right</text>
    <text x="30" y="74" class="mono sub" font-size="13" font-weight="600">Clean architecture, separation of concerns</text>
    <line x1="30" y1="92" x2="460" y2="92" stroke="#1683DF" stroke-width="1" opacity="0.25" />
    
    <text x="30" y="126" class="sans text" font-size="15" fill="#c9d1d9">Follow SOLID principles and clean patterns.</text>
    <text x="30" y="152" class="sans text" font-size="15" fill="#c9d1d9">Write self-documenting code with clear contracts.</text>
    <text x="30" y="188" class="mono" font-size="13" fill="#38bdf8">→ Modular components &amp; robust typing</text>
  </g>

  <!-- Pillar 3: Scale Fast -->
  <g transform="translate(1074, 104)">
    <rect width="490" height="224" rx="12" fill="#091428" stroke="#1683DF" stroke-width="1.5" />
    <rect width="490" height="6" fill="#22C55E" />
    
    <text x="30" y="44" class="sans title" font-size="22">📈 Scale Fast</text>
    <text x="30" y="74" class="mono sub" font-size="13" font-weight="600">Code for today, architect for tomorrow</text>
    <line x1="30" y1="92" x2="460" y2="92" stroke="#1683DF" stroke-width="1" opacity="0.25" />
    
    <text x="30" y="126" class="sans text" font-size="15" fill="#c9d1d9">Automate testing, CI/CD pipelines, and cloud deploys.</text>
    <text x="30" y="152" class="sans text" font-size="15" fill="#c9d1d9">Optimize database queries and async background jobs.</text>
    <text x="30" y="188" class="mono" font-size="13" fill="#22C55E">→ Resilient cloud infrastructure</text>
  </g>
</svg>
