<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 540" width="100%" height="100%">

  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060b17" />
      <stop offset="50%" stop-color="#0a1428" />
      <stop offset="100%" stop-color="#060b17" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1683df" stroke-width="0.6" opacity="0.1" />
    </pattern>
  </defs>
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif; }
    .title { font-weight: 700; fill: #f0f6fc; }
    .sub { fill: #93CCE9; }
    .text { fill: #c9d1d9; font-size: 14px; }
  </style>

  <!-- Card Background -->
  <rect width="780" height="540" rx="14" fill="url(#cardBg)" stroke="#1683DF" stroke-width="2" opacity="0.95" />
  <rect width="780" height="540" rx="14" fill="url(#grid)" />

  <!-- Corner Brackets -->
  <path d="M 12 36 V 12 H 36 M 744 12 H 768 V 36 M 12 504 V 528 H 36 M 744 528 H 768 V 504" fill="none" stroke="#1683DF" stroke-width="3" />

  <!-- Top Accent Line -->
  <rect x="0" y="0" width="780" height="4" fill="#1683DF" />

  <!-- Title -->
  <text x="32" y="44" class="sans title" font-size="24">🏠 BoardEase</text>

  <!-- Tagline blockquote box -->
  <g transform="translate(32, 60)">
    <rect width="716" height="66" rx="6" fill="#091428" stroke="#1683DF" stroke-width="1" opacity="0.7" />
    <path d="M 0 0 V 66" stroke="#1683DF" stroke-width="3.5" />
    <text x="16" y="24" class="sans" font-size="13" font-style="italic" fill="#8b949e">
      A full-stack boarding house management system that handles the complete rental lifecycle: ...
    </text>
  </g>

  <!-- Stack Section with Branded Icons -->
  <text x="32" y="142" class="mono sub" font-size="11" font-weight="700">TECH STACK:</text>
  
      <g transform="translate(32, 150)">
        <rect width="80" height="28" rx="6" fill="#060b17" stroke="#777BB4" stroke-width="1.2" />
        <g transform="translate(14, 14)"><ellipse cx="0" cy="0" rx="7.5" ry="5" fill="none" stroke="#777BB4" stroke-width="1.2"/><text x="0" y="2.2" font-family="sans-serif" font-size="5" font-weight="900" fill="#777BB4" text-anchor="middle">PHP</text></g>
        <text x="25" y="18" class="mono" font-size="11" font-weight="600" fill="#f0f6fc">PHP</text>
      </g>
    
      <g transform="translate(122, 150)">
        <rect width="80" height="28" rx="6" fill="#060b17" stroke="#512BD4" stroke-width="1.2" />
        <g transform="translate(14, 14)"><rect x="-6" y="-6" width="12" height="12" rx="2" fill="#512BD4"/><text x="0" y="3.5" font-family="sans-serif" font-size="6.5" font-weight="900" fill="#ffffff" text-anchor="middle">WPF</text></g>
        <text x="25" y="18" class="mono" font-size="11" font-weight="600" fill="#f0f6fc">WPF</text>
      </g>
    
      <g transform="translate(212, 150)">
        <rect width="130" height="28" rx="6" fill="#060b17" stroke="#61DAFB" stroke-width="1.2" />
        <g transform="translate(14, 14)"><rect x="-5" y="-7.5" width="10" height="15" rx="1.5" fill="none" stroke="#61DAFB" stroke-width="1"/><circle cx="0" cy="0" r="1.5" fill="#61DAFB"/><ellipse cx="0" cy="0" rx="4" ry="1.5" fill="none" stroke="#61DAFB" stroke-width="0.7"/></g>
        <text x="25" y="18" class="mono" font-size="11" font-weight="600" fill="#f0f6fc">React Native</text>
      </g>
    
      <g transform="translate(352, 150)">
        <rect width="80" height="28" rx="6" fill="#060b17" stroke="#f0f6fc" stroke-width="1.2" />
        <g transform="translate(14, 14)"><polygon points="-5,5 0,-5 5,5 2.5,5 0,0 -2.5,5" fill="#f0f6fc"/></g>
        <text x="25" y="18" class="mono" font-size="11" font-weight="600" fill="#f0f6fc">Expo</text>
      </g>
    
      <g transform="translate(442, 150)">
        <rect width="110" height="28" rx="6" fill="#060b17" stroke="#f0f6fc" stroke-width="1.2" />
        <g transform="translate(14, 14)"><text x="0" y="3" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="800" fill="#f0f6fc" text-anchor="middle">ex</text></g>
        <text x="25" y="18" class="mono" font-size="11" font-weight="600" fill="#f0f6fc">Express.js</text>
      </g>
    
      <g transform="translate(562, 150)">
        <rect width="90" height="28" rx="6" fill="#060b17" stroke="#4479A1" stroke-width="1.2" />
        <g transform="translate(14, 14)"><ellipse cx="0" cy="-3" rx="5.5" ry="1.8" fill="none" stroke="#4479A1" stroke-width="1"/><path d="M-5.5,-3 V3 C-5.5,4.8 5.5,4.8 5.5,3 V-3 M-5.5,0 C-5.5,1.5 5.5,1.5 5.5,0" fill="none" stroke="#4479A1" stroke-width="1"/></g>
        <text x="25" y="18" class="mono" font-size="11" font-weight="600" fill="#f0f6fc">MySQL</text>
      </g>
    

  <!-- Divider -->
  <line x1="32" y1="216" x2="748" y2="216" stroke="#1683DF" stroke-width="1" opacity="0.3" />

  <!-- Highlights -->
  <text x="32" y="236" class="mono sub" font-size="11" font-weight="700">HIGHLIGHTS:</text>
  <text x="36" y="250" class="sans text" font-size="14" fill="#c9d1d9">• WPF Desktop App (.NET 8) + React Native Mobile App</text><text x="36" y="276" class="sans text" font-size="14" fill="#c9d1d9">• 🎫 Role-based access (Admin, Owner, Occupant)</text><text x="36" y="302" class="sans text" font-size="14" fill="#c9d1d9">• Stripe &amp; PayMongo payment integrations</text><text x="36" y="328" class="sans text" font-size="14" fill="#c9d1d9">• Real-time notifications via SignalR</text><text x="36" y="354" class="sans text" font-size="14" fill="#c9d1d9">• Built-in AI assistant (Gemini)</text><text x="36" y="380" class="sans text" font-size="14" fill="#c9d1d9">• Reports &amp; Analytics</text>

  <!-- Bottom Action Button Banner -->
  <g transform="translate(32, 474)">
    <rect width="716" height="42" rx="8" fill="#060b17" stroke="#1683DF" stroke-width="1.5" />
    <text x="358" y="26" class="mono" font-size="13" font-weight="700" fill="#1683DF" text-anchor="middle" letter-spacing="1">
      📂 DESKTOP / MOBILE →
    </text>
  </g>
</svg>
