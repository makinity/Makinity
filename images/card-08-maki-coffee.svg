<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 640" width="100%" height="100%">

  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060b17" />
      <stop offset="50%" stop-color="#0a1428" />
      <stop offset="100%" stop-color="#060b17" />
    </linearGradient>
    <linearGradient id="neonBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#93CCE9" />
      <stop offset="50%" stop-color="#1683DF" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#1683df" stroke-width="0.7" opacity="0.1" />
    </pattern>
  </defs>
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif; }
    .title { font-weight: 700; fill: #f0f6fc; }
    .sub { fill: #93CCE9; }
    .text { fill: #c9d1d9; }
  </style>

  <!-- Card Background -->
  <rect width="780" height="640" rx="16" fill="url(#cardBg)" stroke="#1683DF" stroke-width="2.2" opacity="0.95" />
  <rect width="780" height="640" rx="16" fill="url(#grid)" />

  <!-- Corner Brackets -->
  <path d="M 12 40 V 12 H 40 M 740 12 H 768 V 40 M 12 600 V 628 H 40 M 740 628 H 768 V 600" fill="none" stroke="#1683DF" stroke-width="3.5" />

  <!-- Top Accent Line -->
  <rect x="0" y="0" width="780" height="5" fill="#38bdf8" />

  <!-- Title -->
  <text x="32" y="48" class="sans title" font-size="28">☕ Maki Coffee Co.</text>

  <!-- Tagline blockquote box -->
  <g transform="translate(32, 66)">
    <rect width="716" height="66" rx="8" fill="#091428" stroke="#1683DF" stroke-width="1.2" opacity="0.75" />
    <path d="M 0 0 V 66" stroke="#1683DF" stroke-width="4" />
    <text x="18" y="38" class="sans" font-size="16" font-style="italic" fill="#8b949e">
      Full Shopify theme built from scratch for a specialty coffee brand — production-ready.
    </text>
  </g>

  <!-- Stack Section with Branded Icons -->
  <text x="32" y="146" class="mono sub" font-size="13" font-weight="700">TECH STACK:</text>
  
      <g transform="translate(32, 155)">
        <rect width="115" height="36" rx="8" fill="#060b17" stroke="#96BF48" stroke-width="1.4" />
        <g transform="translate(18, 18)"><path d="M-3,-5 C-3,-9 3,-9 3,-5 M-8,-3 L8,-3 L6,10 L-6,10 Z" fill="#96BF48" stroke="#96BF48" stroke-width="1.3"/><text x="0" y="5.5" font-family="sans-serif" font-size="9" font-weight="900" fill="#091428" text-anchor="middle">S</text></g>
        <text x="34" y="23" class="mono" font-size="13" font-weight="700" fill="#f0f6fc">Shopify</text>
      </g>
    
      <g transform="translate(159, 155)">
        <rect width="105" height="36" rx="8" fill="#060b17" stroke="#008CDD" stroke-width="1.4" />
        <g transform="translate(18, 18)"></g>
        <text x="34" y="23" class="mono" font-size="13" font-weight="700" fill="#f0f6fc">Liquid</text>
      </g>
    
      <g transform="translate(276, 155)">
        <rect width="95" height="36" rx="8" fill="#060b17" stroke="#1572B6" stroke-width="1.4" />
        <g transform="translate(18, 18)"><path d="M-9,-10 L9,-10 L7.5,8 L0,10 L-7.5,8 Z" fill="#1572B6"/><path d="M0,-8 L0,8.2 L5.8,6.6 L7,-8 Z" fill="#33A9DC"/><path d="M-5,-5.5 H5 L4.7,-2.5 H-4.8 Z M-4.7,0.5 H4.4 L4,4 L0,5.2 L-4,4 L-4.2,2 H-2.2 L-2.1,2.8 L0,3.4 L2.1,2.8 L2.2,1.5 H-4.7 Z" fill="#FFFFFF"/></g>
        <text x="34" y="23" class="mono" font-size="13" font-weight="700" fill="#f0f6fc">CSS3</text>
      </g>
    
      <g transform="translate(383, 155)">
        <rect width="135" height="36" rx="8" fill="#060b17" stroke="#F7DF1E" stroke-width="1.4" />
        <g transform="translate(18, 18)"><rect x="-10" y="-10" width="20" height="20" rx="2.5" fill="#F7DF1E"/><text x="3" y="6" font-family="sans-serif" font-size="11" font-weight="900" fill="#000000" text-anchor="end">JS</text></g>
        <text x="34" y="23" class="mono" font-size="13" font-weight="700" fill="#f0f6fc">JavaScript</text>
      </g>
    
      <g transform="translate(530, 155)">
        <rect width="120" height="36" rx="8" fill="#060b17" stroke="#FF6B00" stroke-width="1.4" />
        <g transform="translate(18, 18)"><rect x="-8" y="-8" width="16" height="16" rx="2.5" fill="none" stroke="#FF6B00" stroke-width="1.6"/><circle cx="0" cy="0" r="2.8" fill="#FF6B00"/><path d="M0,-10.5 V-8 M0,8 V10.5 M-10.5,0 H-8 M8,0 H10.5" stroke="#FF6B00" stroke-width="1.3"/></g>
        <text x="34" y="23" class="mono" font-size="13" font-weight="700" fill="#f0f6fc">Groq API</text>
      </g>
    

  <!-- Divider -->
  <line x1="32" y1="246" x2="748" y2="246" stroke="#1683DF" stroke-width="1.2" opacity="0.3" />

  <!-- Highlights -->
  <text x="32" y="266" class="mono sub" font-size="13" font-weight="700">HIGHLIGHTS:</text>
  <text x="36" y="280" class="sans text" font-size="17" font-weight="500" fill="#c9d1d9">• Full brand system — CSS tokens, Playfair Display</text><text x="36" y="312" class="sans text" font-size="17" font-weight="500" fill="#c9d1d9">• 🛍️ Custom sections with Shopify schema &amp; block repeaters</text><text x="36" y="344" class="sans text" font-size="17" font-weight="500" fill="#c9d1d9">• Product page with gallery, variant picker &amp; quantity stepper</text><text x="36" y="376" class="sans text" font-size="17" font-weight="500" fill="#c9d1d9">• AJAX add-to-cart with live cart count feedback</text><text x="36" y="408" class="sans text" font-size="17" font-weight="500" fill="#c9d1d9">• Floating AI chatbot widget wired to Groq API proxy</text><text x="36" y="440" class="sans text" font-size="17" font-weight="500" fill="#c9d1d9">• Scroll-triggered animations via IntersectionObserver</text>

  <!-- Bottom Action Button Banner -->
  <g transform="translate(32, 566)">
    <rect width="716" height="52" rx="10" fill="#060b17" stroke="#38bdf8" stroke-width="1.8" />
    <text x="358" y="33" class="mono" font-size="16" font-weight="800" fill="#38bdf8" text-anchor="middle" letter-spacing="1">
      📂 REPO · 🌐 LIVE STORE →
    </text>
  </g>
</svg>
