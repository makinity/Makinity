<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 540" width="100%" height="100%">

  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060b17" />
      <stop offset="50%" stop-color="#0a1428" />
      <stop offset="100%" stop-color="#060b17" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1683df" stroke-width="0.6" opacity="0.1" />
    </pattern>
  </defs>
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif; }
    .title { font-weight: 700; fill: #f0f6fc; }
    .sub { fill: #93CCE9; }
    .text { fill: #c9d1d9; font-size: 14px; }
  </style>

  <!-- Card Background -->
  <rect width="780" height="540" rx="14" fill="url(#cardBg)" stroke="#1683DF" stroke-width="2" opacity="0.95" />
  <rect width="780" height="540" rx="14" fill="url(#grid)" />

  <!-- Corner Brackets -->
  <path d="M 12 36 V 12 H 36 M 744 12 H 768 V 36 M 12 504 V 528 H 36 M 744 528 H 768 V 504" fill="none" stroke="#1683DF" stroke-width="3" />

  <!-- Top Accent Line -->
  <rect x="0" y="0" width="780" height="4" fill="#1683DF" />

  <!-- Title -->
  <text x="32" y="44" class="sans title" font-size="24">🍗 Chicken Express</text>

  <!-- Tagline blockquote box -->
  <g transform="translate(32, 60)">
    <rect width="716" height="66" rx="6" fill="#091428" stroke="#1683DF" stroke-width="1" opacity="0.7" />
    <path d="M 0 0 V 66" stroke="#1683DF" stroke-width="3.5" />
    <text x="16" y="24" class="sans" font-size="13" font-style="italic" fill="#8b949e">
      A web-based chicken food ordering system with PayMongo payment integration, featuring a cu...
    </text>
  </g>

  <!-- Stack Section with Branded Icons -->
  <text x="32" y="142" class="mono sub" font-size="11" font-weight="700">TECH STACK:</text>
  
      <g transform="translate(32, 150)">
        <rect width="80" height="28" rx="6" fill="#060b17" stroke="#ED8B00" stroke-width="1.2" />
        <g transform="translate(14, 14)"><path d="M-3,-4 C-3,-6 3,-6 3,-4 M-4,-2 L4,-2 L3,4 C3,5.5 -3,5.5 -3,4 Z M4,0 C5.5,0 5.5,2 4,2" fill="none" stroke="#ED8B00" stroke-width="1.1"/></g>
        <text x="25" y="18" class="mono" font-size="11" font-weight="600" fill="#f0f6fc">Java</text>
      </g>
    
      <g transform="translate(122, 150)">
        <rect width="120" height="28" rx="6" fill="#060b17" stroke="#6DB33F" stroke-width="1.2" />
        <g transform="translate(14, 14)"><circle cx="0" cy="0" r="6" fill="#6DB33F"/><path d="M-2,3 L0,-3 L2,-3 L0,3 Z" fill="#ffffff"/></g>
        <text x="25" y="18" class="mono" font-size="11" font-weight="600" fill="#f0f6fc">Spring Boot</text>
      </g>
    
      <g transform="translate(252, 150)">
        <rect width="110" height="28" rx="6" fill="#060b17" stroke="#22C55E" stroke-width="1.2" />
        <g transform="translate(14, 14)"><path d="M0,-6 C3,-3 4,2 1,5 C-2,2 -3,-3 0,-6 Z" fill="#005F0F" stroke="#22C55E" stroke-width="0.8"/></g>
        <text x="25" y="18" class="mono" font-size="11" font-weight="600" fill="#f0f6fc">Thymeleaf</text>
      </g>
    
      <g transform="translate(372, 150)">
        <rect width="90" height="28" rx="6" fill="#060b17" stroke="#4479A1" stroke-width="1.2" />
        <g transform="translate(14, 14)"><ellipse cx="0" cy="-3" rx="5.5" ry="1.8" fill="none" stroke="#4479A1" stroke-width="1"/><path d="M-5.5,-3 V3 C-5.5,4.8 5.5,4.8 5.5,3 V-3 M-5.5,0 C-5.5,1.5 5.5,1.5 5.5,0" fill="none" stroke="#4479A1" stroke-width="1"/></g>
        <text x="25" y="18" class="mono" font-size="11" font-weight="600" fill="#f0f6fc">MySQL</text>
      </g>
    
      <g transform="translate(472, 150)">
        <rect width="110" height="28" rx="6" fill="#060b17" stroke="#0066FF" stroke-width="1.2" />
        <g transform="translate(14, 14)"><rect x="-6" y="-6" width="12" height="12" rx="2" fill="#0066FF"/><text x="0" y="3.5" font-family="sans-serif" font-size="8" font-weight="900" fill="#ffffff" text-anchor="middle">P</text></g>
        <text x="25" y="18" class="mono" font-size="11" font-weight="600" fill="#f0f6fc">PayMongo</text>
      </g>
    

  <!-- Divider -->
  <line x1="32" y1="216" x2="748" y2="216" stroke="#1683DF" stroke-width="1" opacity="0.3" />

  <!-- Highlights -->
  <text x="32" y="236" class="mono sub" font-size="11" font-weight="700">HIGHLIGHTS:</text>
  <text x="36" y="250" class="sans text" font-size="14" fill="#c9d1d9">• Customer storefront — browse, cart, checkout &amp; order tracking</text><text x="36" y="276" class="sans text" font-size="14" fill="#c9d1d9">• Spring Security with role-based access (Customer / Admin)</text><text x="36" y="302" class="sans text" font-size="14" fill="#c9d1d9">• PayMongo hosted checkout (GCash, Maya, card)</text><text x="36" y="328" class="sans text" font-size="14" fill="#c9d1d9">• Webhook-driven order status updates</text><text x="36" y="354" class="sans text" font-size="14" fill="#c9d1d9">• Admin dashboard with Excel &amp; PDF reports</text><text x="36" y="380" class="sans text" font-size="14" fill="#c9d1d9">• Full product &amp; order management system</text>

  <!-- Bottom Action Button Banner -->
  <g transform="translate(32, 474)">
    <rect width="716" height="42" rx="8" fill="#060b17" stroke="#1683DF" stroke-width="1.5" />
    <text x="358" y="26" class="mono" font-size="13" font-weight="700" fill="#1683DF" text-anchor="middle" letter-spacing="1">
      📂 VIEW REPO →
    </text>
  </g>
</svg>
