<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 640" width="100%" height="100%">

  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060b17" />
      <stop offset="50%" stop-color="#0a1428" />
      <stop offset="100%" stop-color="#060b17" />
    </linearGradient>
    <linearGradient id="neonBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#93CCE9" />
      <stop offset="50%" stop-color="#1683DF" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#1683df" stroke-width="0.7" opacity="0.1" />
    </pattern>
  </defs>
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif; }
    .title { font-weight: 700; fill: #f0f6fc; }
    .sub { fill: #93CCE9; }
    .text { fill: #c9d1d9; }
  </style>

  <!-- Card Background -->
  <rect width="780" height="640" rx="16" fill="url(#cardBg)" stroke="#1683DF" stroke-width="2.2" opacity="0.95" />
  <rect width="780" height="640" rx="16" fill="url(#grid)" />

  <!-- Corner Brackets -->
  <path d="M 12 40 V 12 H 40 M 740 12 H 768 V 40 M 12 600 V 628 H 40 M 740 628 H 768 V 600" fill="none" stroke="#1683DF" stroke-width="3.5" />

  <!-- Top Accent Line -->
  <rect x="0" y="0" width="780" height="5" fill="#22C55E" />

  <!-- Title -->
  <text x="32" y="48" class="sans title" font-size="28">📊 Smart PMS</text>

  <!-- Tagline blockquote box -->
  <g transform="translate(32, 66)">
    <rect width="716" height="66" rx="8" fill="#091428" stroke="#1683DF" stroke-width="1.2" opacity="0.75" />
    <path d="M 0 0 V 66" stroke="#1683DF" stroke-width="4" />
    <text x="18" y="38" class="sans" font-size="16" font-style="italic" fill="#8b949e">
      Smart Performance Management System integrating machine learning with modern web tech.
    </text>
  </g>

  <!-- Stack Section with Branded Icons -->
  <text x="32" y="146" class="mono sub" font-size="13" font-weight="700">TECH STACK:</text>
  
      <g transform="translate(32, 155)">
        <rect width="110" height="36" rx="8" fill="#060b17" stroke="#3776AB" stroke-width="1.4" />
        <g transform="translate(18, 18)"><path d="M-6.5,-4.5 C-6.5,-8 0,-8 0,-4.5 V-1.2 H4.5 C8,-1.2 8,4.5 4.5,4.5 H2" fill="none" stroke="#3776AB" stroke-width="1.6"/><path d="M6.5,4.5 C6.5,8 0,8 0,4.5 V1.2 H-4.5 C-8,1.2 -8,-4.5 -4.5,-4.5 H-2" fill="none" stroke="#FFD43B" stroke-width="1.6"/><circle cx="-2.8" cy="-5.5" r="1" fill="#3776AB"/><circle cx="2.8" cy="5.5" r="1" fill="#FFD43B"/></g>
        <text x="34" y="23" class="mono" font-size="13" font-weight="700" fill="#f0f6fc">Python</text>
      </g>
    
      <g transform="translate(154, 155)">
        <rect width="115" height="36" rx="8" fill="#060b17" stroke="#FF2D20" stroke-width="1.4" />
        <g transform="translate(18, 18)"><path d="M-9,-4.5 L0,-9 L9,-4.5 L0,0 Z M-9,-1 L0,3.5 L9,-1 M-9,3 L0,7.5 L9,3" fill="none" stroke="#FF2D20" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g>
        <text x="34" y="23" class="mono" font-size="13" font-weight="700" fill="#f0f6fc">Laravel</text>
      </g>
    
      <g transform="translate(281, 155)">
        <rect width="100" height="36" rx="8" fill="#060b17" stroke="#61DAFB" stroke-width="1.4" />
        <g transform="translate(18, 18)"><circle cx="0" cy="0" r="3.2" fill="#61DAFB"/><ellipse cx="0" cy="0" rx="12" ry="4.8" fill="none" stroke="#61DAFB" stroke-width="1.4"/><ellipse cx="0" cy="0" rx="12" ry="4.8" fill="none" stroke="#61DAFB" stroke-width="1.4" transform="rotate(60)"/><ellipse cx="0" cy="0" rx="12" ry="4.8" fill="none" stroke="#61DAFB" stroke-width="1.4" transform="rotate(120)"/></g>
        <text x="34" y="23" class="mono" font-size="13" font-weight="700" fill="#f0f6fc">React</text>
      </g>
    
      <g transform="translate(393, 155)">
        <rect width="110" height="36" rx="8" fill="#060b17" stroke="#4479A1" stroke-width="1.4" />
        <g transform="translate(18, 18)"><ellipse cx="0" cy="-4" rx="8" ry="2.8" fill="none" stroke="#4479A1" stroke-width="1.5"/><path d="M-8,-4 V4 C-8,6.8 8,6.8 8,4 V-4 M-8,0 C-8,2.5 8,2.5 8,0" fill="none" stroke="#4479A1" stroke-width="1.5"/></g>
        <text x="34" y="23" class="mono" font-size="13" font-weight="700" fill="#f0f6fc">MySQL</text>
      </g>
    
      <g transform="translate(515, 155)">
        <rect width="160" height="36" rx="8" fill="#060b17" stroke="#22C55E" stroke-width="1.4" />
        <g transform="translate(18, 18)"></g>
        <text x="34" y="23" class="mono" font-size="13" font-weight="700" fill="#f0f6fc">Random Forest</text>
      </g>
    

  <!-- Divider -->
  <line x1="32" y1="246" x2="748" y2="246" stroke="#1683DF" stroke-width="1.2" opacity="0.3" />

  <!-- Highlights -->
  <text x="32" y="266" class="mono sub" font-size="13" font-weight="700">HIGHLIGHTS:</text>
  <text x="36" y="280" class="sans text" font-size="17" font-weight="500" fill="#c9d1d9">• Random Forest ML model for performance prediction</text><text x="36" y="312" class="sans text" font-size="17" font-weight="500" fill="#c9d1d9">• Data visualization &amp; analytics dashboard</text><text x="36" y="344" class="sans text" font-size="17" font-weight="500" fill="#c9d1d9">• Laravel backend with clean architecture</text><text x="36" y="376" class="sans text" font-size="17" font-weight="500" fill="#c9d1d9">• Role-based dashboards</text><text x="36" y="408" class="sans text" font-size="17" font-weight="500" fill="#c9d1d9">• Employee evaluation system</text><text x="36" y="440" class="sans text" font-size="17" font-weight="500" fill="#c9d1d9">• Department management</text>

  <!-- Bottom Action Button Banner -->
  <g transform="translate(32, 566)">
    <rect width="716" height="52" rx="10" fill="#060b17" stroke="#22C55E" stroke-width="1.8" />
    <text x="358" y="33" class="mono" font-size="16" font-weight="800" fill="#22C55E" text-anchor="middle" letter-spacing="1">
      🚀 LIVE DEMO · ⭐ STARRED →
    </text>
  </g>
</svg>
