      <text x="24" y="66" class="sans text" font-size="14" fill="#f0f6fc">Completing BSIT degree</text>
      <text x="24" y="92" class="mono sub" font-size="12">Expected graduation: 2026</text>
    </g>
  
  
    <g transform="translate(555, 36)">
      <rect width="490" height="135" rx="10" fill="#091428" stroke="#1683DF" stroke-width="1.2" />
      <text x="24" y="38" class="sans title" font-size="18">🏗️ BoardEase</text>
      <text x="24" y="66" class="sans text" font-size="14" fill="#f0f6fc">Full-stack boarding house system</text>
      <text x="24" y="92" class="mono sub" font-size="12">Desktop + Mobile + API</text>
    </g>
  
  
    <g transform="translate(1074, 36)">
      <rect width="490" height="135" rx="10" fill="#091428" stroke="#1683DF" stroke-width="1.2" />
