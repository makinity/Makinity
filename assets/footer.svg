<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="120" viewBox="0 0 1280 120">
  <defs>
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0a0f1e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#111f42;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0f1e;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="footerLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1683DF;stop-opacity:0" />
      <stop offset="30%" style="stop-color:#1683DF;stop-opacity:0.6" />
      <stop offset="50%" style="stop-color:#00d4ff;stop-opacity:0.8" />
      <stop offset="70%" style="stop-color:#1683DF;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#1683DF;stop-opacity:0" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1280" height="120" fill="url(#footerBg)"/>
  
  <!-- Top accent line -->
  <line x1="0" y1="1" x2="1280" y2="1" stroke="url(#footerLine)" stroke-width="1"/>
  
  <!-- Decorative dots -->
  <g fill="#1683DF" opacity="0.2">
    <circle cx="100" cy="30" r="1"/>
    <circle cx="300" cy="60" r="1"/>
    <circle cx="500" cy="25" r="1"/>
    <circle cx="700" cy="70" r="1"/>
    <circle cx="900" cy="35" r="1"/>
    <circle cx="1100" cy="55" r="1"/>
  </g>
  
  <!-- MakiSync brand -->
  <text x="640" y="50" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="600" fill="#93CCE9" letter-spacing="4" opacity="0.7">
    MAKISYNC
  </text>
  
  <!-- Tagline -->
  <text x="640" y="75" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" fill="#6B7280" letter-spacing="1" opacity="0.6">
    Building Digital Solutions · Empowering Businesses Through Technology
  </text>
  
  <!-- Copyright -->
  <text x="640" y="100" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" fill="#4B5563" opacity="0.5">
    © 2026 Mark Vencent L. Juntilla · Crafted with precision
  </text>
  
  <!-- Bottom glow -->
  <rect x="400" y="118" width="480" height="1" fill="url(#footerLine)" opacity="0.3"/>
</svg>