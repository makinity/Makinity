<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400">
  <defs>
    <!-- Gradient definitions -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f1e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#111f42;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0f1e;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1683DF;stop-opacity:0" />
      <stop offset="30%" style="stop-color:#1683DF;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#1683DF;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#1683DF;stop-opacity:0" />
    </linearGradient>
    
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#93CCE9" />
      <stop offset="50%" style="stop-color:#ffffff" />
      <stop offset="100%" style="stop-color:#93CCE9" />
    </linearGradient>
    
    <radialGradient id="orbGrad1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#1683DF;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#1683DF;stop-opacity:0" />
    </radialGradient>
    
    <radialGradient id="orbGrad2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:0" />
    </radialGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1683DF" stroke-width="0.3" opacity="0.15"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="1280" height="400" fill="url(#bgGrad)"/>
  
  <!-- Grid overlay -->
  <rect width="1280" height="400" fill="url(#grid)" opacity="0.5"/>
  
  <!-- Ambient orbs -->
  <circle cx="200" cy="100" r="180" fill="url(#orbGrad1)"/>
  <circle cx="1100" cy="300" r="200" fill="url(#orbGrad2)"/>
  <circle cx="640" cy="200" r="150" fill="url(#orbGrad1)" opacity="0.3"/>
  
  <!-- Decorative circuit lines -->
  <g stroke="#1683DF" stroke-width="0.5" opacity="0.2" fill="none">
    <path d="M 0,300 Q 200,250 400,280 T 800,260 T 1280,300"/>
    <path d="M 0,320 Q 300,270 600,300 T 1280,280"/>
    <path d="M 0,100 Q 200,130 400,90 T 800,110 T 1280,80"/>
  </g>
  
  <!-- Subtle tech dots -->
  <g fill="#1683DF" opacity="0.3">
    <circle cx="100" cy="80" r="1.5"/>
    <circle cx="250" cy="150" r="1"/>
    <circle cx="400" cy="60" r="1.5"/>
    <circle cx="550" cy="350" r="1"/>
    <circle cx="700" cy="120" r="1.5"/>
    <circle cx="850" cy="300" r="1"/>
    <circle cx="1000" cy="80" r="1.5"/>
    <circle cx="1150" cy="200" r="1"/>
    <circle cx="1200" cy="350" r="1.5"/>
  </g>
  
  <!-- Center glow accent -->
  <ellipse cx="640" cy="200" rx="350" ry="80" fill="url(#glowGrad)" opacity="0.08"/>
  
  <!-- Name text -->
  <text x="640" y="175" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="56" font-weight="700" fill="url(#nameGrad)" filter="url(#glow)">
    Mark Vencent L. Juntilla
  </text>
  
  <!-- Tagline -->
  <text x="640" y="220" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="18" font-weight="300" fill="#93CCE9" letter-spacing="6" opacity="0.9">
    FULL-STACK DEVELOPER · AI ENTHUSIAST · PROBLEM SOLVER
  </text>
  
  <!-- Thin accent line under tagline -->
  <line x1="440" y1="240" x2="840" y2="240" stroke="url(#glowGrad)" stroke-width="1" opacity="0.5"/>
  
  <!-- Tech icons area - subtle -->
  <g opacity="0.5" filter="url(#softGlow)">
    <!-- React icon hint -->
    <g transform="translate(420, 280)">
      <circle cx="0" cy="0" r="14" fill="none" stroke="#61DAFB" stroke-width="1" opacity="0.6"/>
      <ellipse cx="0" cy="0" rx="12" ry="5" fill="none" stroke="#61DAFB" stroke-width="0.8" transform="rotate(0)" opacity="0.4"/>
      <ellipse cx="0" cy="0" rx="12" ry="5" fill="none" stroke="#61DAFB" stroke-width="0.8" transform="rotate(60)" opacity="0.4"/>
      <ellipse cx="0" cy="0" rx="12" ry="5" fill="none" stroke="#61DAFB" stroke-width="0.8" transform="rotate(120)" opacity="0.4"/>
    </g>
    <!-- Laravel icon hint -->
    <g transform="translate(500, 280)">
      <rect x="-12" y="-12" width="24" height="24" rx="3" fill="none" stroke="#FF2D20" stroke-width="1" opacity="0.6"/>
      <text x="0" y="5" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#FF2D20" opacity="0.5">L</text>
    </g>
    <!-- Node.js icon hint -->
    <g transform="translate(580, 280)">
      <polygon points="0,-14 12,7 -12,7" fill="none" stroke="#68A063" stroke-width="1" opacity="0.6"/>
    </g>
    <!-- PHP icon hint -->
    <g transform="translate(660, 280)">
      <ellipse cx="0" cy="0" rx="14" ry="10" fill="none" stroke="#777BB4" stroke-width="1" opacity="0.6"/>
    </g>
    <!-- Python icon hint -->
    <g transform="translate(740, 280)">
      <path d="M-10,10 Q-12,-5 0,-12 Q12,-5 10,10" fill="none" stroke="#3776AB" stroke-width="1" opacity="0.6"/>
    </g>
    <!-- C# icon hint -->
    <g transform="translate(820, 280)">
      <text x="0" y="5" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#68217A" opacity="0.6">C#</text>
    </g>
  </g>
  
  <!-- Bottom border glow -->
  <line x1="0" y1="399" x2="1280" y2="399" stroke="url(#glowGrad)" stroke-width="2" opacity="0.6"/>
</svg>